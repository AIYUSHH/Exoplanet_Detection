[project]
name = "exoplanet-detection"
version = "0.1.0"
description = "Machine Learning based Exoplanet Detection using Kepler Light Curves"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.9",

    "astropy>=6.0",
    "lightkurve>=2.5",

    "numba>=0.59",

    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",

    "pyarrow>=17.0",
    "fastparquet>=2024.5",

    "tqdm>=4.66",
    "joblib>=1.4",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.3",
    "torchvision>=0.18",
]

dev = [
    "jupyter",
    "ipykernel",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false